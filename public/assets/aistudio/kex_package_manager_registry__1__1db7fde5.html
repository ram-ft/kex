<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kex — package manager &amp; registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --px:clamp(16px,4.5vw,96px);
  --bg:#dcdcde;
  --ink:#161617;
  --pn:#ececee;
  --ln:#bdbdc1;
  --mut:#5f5f64;
  --dk-bg:#1d1d1f;
  --dk-pn:#2a2a2d;
  --dk-ln:#3d3d41;
  --dk-ink:#ececee;
  --dk-mut:#a0a0a6;
  --rad:8px;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html{font-size:15px;scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--ink);
  font:400 1rem/1.55 'Geist',system-ui,-apple-system,sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}
.mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,monospace}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
svg.lucide{width:1.05em;height:1.05em;stroke-width:1.75;flex:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dk :focus-visible{outline-color:var(--dk-ink)}

/* Inline Header Bar (mixed into header) */
.top-inline{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  margin-bottom:clamp(18px,3vh,36px);
}
.top-inline.lt .brand-btn{color:var(--ink)}
.top-inline.lt .pill-profile{
  background:var(--pn);
  border-color:var(--ln);
  color:var(--ink);
}
.top-inline.lt .pill-profile:hover{background:#e2e2e5;border-color:#9e9ea4}
.top-inline.lt .avatar-xs{background:var(--ink);color:var(--pn)}
.brand-btn{
  background:none;
  border:0;
  padding:0;
  font-weight:800;
  font-size:1.45rem;
  letter-spacing:-0.05em;
  color:#ececee;
  display:inline-flex;
  align-items:center;
}
.brand-btn:hover{opacity:.85}
.nav-actions{display:flex;align-items:center;gap:.6rem}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.45rem;
  padding:.48rem .9rem;
  border-radius:var(--rad);
  border:1px solid var(--ln);
  background:var(--pn);
  color:var(--ink);
  font-weight:600;
  font-size:.88rem;
  transition:background .15s,border-color .15s,transform .1s;
  white-space:nowrap;
}
.btn:hover{background:#e2e2e5;border-color:#9e9ea4}
.btn:active{transform:scale(.98)}
.btn-dark{
  background:#161617;
  color:#ececee;
  border-color:#161617;
}
.btn-dark:hover{background:#2a2a2d;border-color:#2a2a2d}
.btn-light-dk{
  background:#ececee;
  color:#161617;
  border-color:#ececee;
}
.btn-light-dk:hover{background:#ffffff;border-color:#ffffff}
.btn-ghost-dk{
  background:#2a2a2d;
  color:#ececee;
  border-color:#3d3d41;
}
.btn-ghost-dk:hover{background:#343438;border-color:#525258}
.btn-sm{padding:.34rem .68rem;font-size:.82rem}
.pill-profile{
  display:inline-flex;
  align-items:center;
  gap:.45rem;
  padding:.38rem .8rem .38rem .45rem;
  border-radius:999px;
  border:1px solid #3d3d41;
  background:#2a2a2d;
  color:#ececee;
  font-size:.86rem;
  font-weight:600;
  transition:background .15s,border-color .15s;
}
.pill-profile:hover{background:#343438;border-color:#5f5f64}
.avatar-xs{
  width:22px;
  height:22px;
  border-radius:999px;
  background:#ececee;
  color:#161617;
  font-size:.7rem;
  font-weight:800;
  display:grid;
  place-items:center;
  letter-spacing:-0.03em;
}

/* Layout Containers */
main{flex:1}
.wrap{padding:clamp(24px,3.5vw,52px) var(--px)}
.sec-dk{
  background:var(--dk-bg);
  color:var(--dk-ink);
  padding:clamp(32px,4.5vw,68px) var(--px);
  border-bottom:1px solid var(--dk-ln);
}
.sec-lt{
  background:var(--bg);
  color:var(--ink);
  padding:clamp(28px,3.5vw,52px) var(--px);
}
.pn{
  background:var(--pn);
  border:1px solid var(--ln);
  border-radius:var(--rad);
}
.pn-dk{
  background:var(--dk-pn);
  border:1px solid var(--dk-ln);
  border-radius:var(--rad);
}

/* Typography */
h1,h2,h3,h4{font-weight:800;letter-spacing:-0.045em;line-height:1.05}
.hero-title{
  font-size:clamp(2.1rem,4.6vw,4.1rem);
  letter-spacing:-0.05em;
  line-height:1.01;
  max-width:17ch;
}
.sec-title{
  font-size:clamp(1.35rem,2vw,1.85rem);
  letter-spacing:-0.035em;
}
.mut{color:var(--mut)}
.dk-mut{color:var(--dk-mut)}

/* Hero Section */
.hero-grid{
  display:grid;
  gap:2rem;
  align-items:end;
}
@media(min-width:960px){
  .hero-grid{grid-template-columns:1.25fr .9fr;gap:3rem}
}
.hero-search{
  margin-top:1.75rem;
  display:flex;
  align-items:center;
  gap:.6rem;
  background:#2a2a2d;
  border:1px solid #3d3d41;
  border-radius:var(--rad);
  padding:.35rem .4rem .35rem .9rem;
  transition:border-color .15s,box-shadow .15s;
}
.hero-search:focus-within{border-color:#ececee;box-shadow:0 0 0 3px #ececee1f}
.hero-search input{
  flex:1;
  min-width:0;
  background:none;
  border:0;
  outline:0;
  color:#ececee;
  font-size:.96rem;
  padding:.45rem 0;
}
.hero-search input::placeholder{color:#8c8c93}
.kbd{
  font-family:'Geist Mono',monospace;
  font-size:.75rem;
  padding:.15rem .45rem;
  border:1px solid #3d3d41;
  border-radius:5px;
  color:#a0a0a6;
  background:#1d1d1f;
}
.cmd-box{
  display:flex;
  align-items:center;
  gap:.7rem;
  background:#141416;
  border:1px solid #333338;
  color:#ececee;
  border-radius:var(--rad);
  padding:.75rem .95rem;
  margin-top:1.1rem;
}
.cmd-box code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem}
.icon-btn{
  background:none;
  border:0;
  color:inherit;
  opacity:.7;
  padding:.3rem;
  border-radius:6px;
  display:grid;
  place-items:center;
}
.icon-btn:hover{opacity:1;background:#ffffff14}

/* Counters */
.counters{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:1px;
  background:#3d3d41;
  border:1px solid #3d3d41;
  border-radius:var(--rad);
  overflow:hidden;
  margin-top:2.2rem;
}
@media(min-width:760px){.counters{grid-template-columns:repeat(4,1fr)}}
.counter-cell{
  background:#1d1d1f;
  padding:1.1rem 1.25rem;
}
.counter-cell b{
  display:block;
  font-size:clamp(1.5rem,2.4vw,2.2rem);
  font-weight:800;
  letter-spacing:-0.05em;
  line-height:1.05;
}
.counter-cell span{font-size:.82rem;color:#a0a0a6}

/* Chips & Badges */
.chip{
  display:inline-flex;
  align-items:center;
  gap:.35rem;
  padding:.24rem .65rem;
  border:1px solid var(--ln);
  border-radius:999px;
  background:var(--pn);
  font-size:.78rem;
  font-weight:600;
  color:var(--ink);
  white-space:nowrap;
}
.chip-dk{
  background:#2a2a2d;
  border-color:#3d3d41;
  color:#ececee;
}
.chip-solid{
  background:#161617;
  border-color:#161617;
  color:#ececee;
}
.chip-btn{
  cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.chip-btn:hover{border-color:var(--ink)}
.chip-btn[aria-pressed="true"]{
  background:#161617;
  color:#ececee;
  border-color:#161617;
}

/* Discover Bento Grid */
.bento-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:.85rem;
  margin-top:1.25rem;
}
@media(min-width:640px){
  .bento-grid{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:1024px){
  .bento-grid{
    grid-template-columns:repeat(6,1fr);
    grid-auto-rows:minmax(132px,auto);
  }
  .bento-c2{grid-column:span 2}
  .bento-r2{grid-row:span 2}
}
.bento-card{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:.85rem;
  padding:1.15rem 1.2rem;
  background:var(--pn);
  border:1px solid var(--ln);
  border-radius:var(--rad);
  text-align:left;
  position:relative;
  overflow:hidden;
  transition:background .16s,color .16s,border-color .16s,transform .14s;
}
.bento-card:hover{
  background:#161617;
  color:#ececee;
  border-color:#161617;
  transform:translateY(-2px);
}
.bento-card:hover .bento-desc,
.bento-card:hover .bento-cnt{color:#a0a0a6}
.bento-card:hover .bento-ico{background:#2a2a2d;border-color:#3d3d41;color:#ececee}
.bento-card.bento-featured{
  background:#1d1d1f;
  color:#ececee;
  border-color:#3d3d41;
}
.bento-card.bento-featured .bento-desc,
.bento-card.bento-featured .bento-cnt{color:#a0a0a6}
.bento-card.bento-featured .bento-ico{background:#2a2a2d;border-color:#3d3d41;color:#ececee}
.bento-card.bento-featured:hover{background:#161617;border-color:#5f5f64}
.bento-top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;width:100%}
.bento-ico{
  width:34px;
  height:34px;
  border-radius:7px;
  border:1px solid var(--ln);
  background:var(--bg);
  display:grid;
  place-items:center;
  transition:background .16s,border-color .16s,color .16s;
}
.bento-cnt{font-size:.76rem;color:var(--mut)}
.bento-name{font-weight:800;font-size:1.05rem;letter-spacing:-0.03em}
.bento-desc{font-size:.83rem;color:var(--mut);line-height:1.4;margin-top:.22rem}
.bento-tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.65rem}
.bento-tag{
  font-family:'Geist Mono',monospace;
  font-size:.72rem;
  padding:.16rem .5rem;
  border-radius:999px;
  border:1px solid #3d3d41;
  background:#2a2a2d;
  color:#ececee;
}

/* Grids & Cards */
.pkg-mini-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:.9rem;
  margin-top:1.1rem;
}
.pkg-mini{
  padding:1.1rem;
  display:flex;
  flex-direction:column;
  gap:.55rem;
  text-align:left;
  transition:border-color .15s,transform .12s;
}
.pkg-mini:hover{border-color:var(--ink);transform:translateY(-1px)}
.scope-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:.9rem;
  margin-top:1.1rem;
}
.scope-card{
  padding:1.15rem;
  display:flex;
  flex-direction:column;
  gap:.5rem;
  text-align:left;
  transition:border-color .15s,background .15s,color .15s;
}
.scope-card:hover{background:#161617;color:#ececee;border-color:#161617}
.scope-card:hover .mut{color:#a0a0a6}

/* Search View */
.search-bar-row{
  display:flex;
  flex-wrap:wrap;
  gap:.75rem;
  align-items:center;
}
.input-box{
  display:flex;
  align-items:center;
  gap:.55rem;
  background:var(--pn);
  border:1px solid var(--ln);
  border-radius:var(--rad);
  padding:0 .85rem;
  flex:1;
  min-width:240px;
}
.input-box:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px #16161714}
.input-box input{
  flex:1;
  min-width:0;
  border:0;
  background:none;
  outline:0;
  padding:.68rem 0;
}
.select-box{
  background:var(--pn);
  border:1px solid var(--ln);
  border-radius:var(--rad);
  padding:.64rem .85rem;
  font-weight:600;
  font-size:.88rem;
}
.cat-scroll{
  display:flex;
  gap:.45rem;
  overflow-x:auto;
  padding:.9rem 0 .4rem;
  scrollbar-width:thin;
}
.pkg-list{display:grid;gap:.8rem;margin-top:1rem}
.pkg-card{
  padding:1.15rem 1.25rem;
  display:grid;
  gap:.9rem;
  transition:border-color .15s;
}
.pkg-card:hover{border-color:var(--ink)}
@media(min-width:780px){
  .pkg-card{grid-template-columns:1fr auto;align-items:center}
}
.pkg-name-link{
  font-weight:800;
  font-size:1.12rem;
  letter-spacing:-0.025em;
  display:inline-flex;
  align-items:center;
  gap:.5rem;
  background:none;
  border:0;
  padding:0;
  text-align:left;
}
.pkg-name-link:hover{text-decoration:underline;text-underline-offset:3px}
.pkg-meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:.7rem;
  font-size:.82rem;
  color:var(--mut);
  margin-top:.55rem;
}
.pkg-right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:.55rem;
}
@media(max-width:779px){
  .pkg-right{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}
}

/* Package Explorer */
.pkg-head-card{
  background:#1d1d1f;
  color:#ececee;
  padding:clamp(24px,3.2vw,44px) var(--px);
  border-bottom:1px solid #3d3d41;
}
.pkg-head-grid{
  display:grid;
  gap:1.5rem;
  align-items:start;
}
@media(min-width:920px){
  .pkg-head-grid{grid-template-columns:1.3fr .9fr}
}
.subtabs{
  display:flex;
  gap:.35rem;
  flex-wrap:wrap;
  border-bottom:1px solid var(--ln);
  padding-bottom:.75rem;
  margin-bottom:1.4rem;
}
.subtab{
  display:inline-flex;
  align-items:center;
  gap:.4rem;
  padding:.45rem .9rem;
  border-radius:999px;
  border:1px solid transparent;
  background:none;
  font-weight:600;
  font-size:.88rem;
  color:var(--mut);
}
.subtab:hover{color:var(--ink);background:#0000000a}
.subtab[aria-selected="true"]{
  background:#161617;
  color:#ececee;
}

/* Markdown-style Readme */
.md-body{padding:1.5rem;line-height:1.65}
.md-body h2{font-size:1.35rem;margin:1.3rem 0 .6rem;padding-bottom:.35rem;border-bottom:1px solid var(--ln)}
.md-body h2:first-child{margin-top:0}
.md-body h3{font-size:1.08rem;margin:1.1rem 0 .45rem}
.md-body p{margin:.55rem 0}
.md-body ul{margin:.5rem 0 .8rem 1.25rem}
.md-body li{margin:.25rem 0}
.code-block{
  background:#161617;
  color:#ececee;
  border-radius:var(--rad);
  padding:.9rem 1rem;
  font-family:'Geist Mono',monospace;
  font-size:.86rem;
  overflow-x:auto;
  position:relative;
  margin:.75rem 0;
}

/* Code Explorer */
.code-shell{
  display:grid;
  border:1px solid var(--ln);
  border-radius:var(--rad);
  overflow:hidden;
  background:var(--pn);
}
@media(min-width:820px){
  .code-shell{grid-template-columns:240px 1fr}
}
.file-tree{
  border-bottom:1px solid var(--ln);
  padding:.65rem;
  background:#e4e4e7;
}
@media(min-width:820px){
  .file-tree{border-bottom:0;border-right:1px solid var(--ln)}
}
.file-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:.5rem;
  padding:.42rem .6rem;
  border:0;
  border-radius:6px;
  background:none;
  text-align:left;
  font-size:.84rem;
  color:var(--ink);
}
.file-item:hover{background:#d4d4d8}
.file-item[aria-selected="true"]{background:#161617;color:#ececee}
.code-viewer-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.6rem 1rem;
  border-bottom:1px solid var(--ln);
  background:#e9e9ec;
  font-size:.84rem;
}
.code-lines{
  padding:.85rem 0;
  overflow-x:auto;
  background:#161617;
  color:#ececee;
  font-family:'Geist Mono',monospace;
  font-size:.83rem;
  line-height:1.55;
}
.code-line{display:flex;padding:0 1rem}
.code-line:hover{background:#232326}
.ln-no{
  width:2.6rem;
  flex:none;
  color:#6c6c73;
  user-select:none;
  text-align:right;
  padding-right:1rem;
}
.ln-txt{white-space:pre}

/* Tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;color:var(--mut);font-weight:600;padding:.75rem 1rem;border-bottom:1px solid var(--ln);font-size:.82rem}
.tbl td{padding:.85rem 1rem;border-bottom:1px solid var(--ln);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}

/* Heatmap (26 weeks) */
.hm-wrap{
  overflow-x:auto;
  padding:1.1rem;
}
.hm-grid{
  display:grid;
  grid-template-columns:repeat(26,minmax(12px,1fr));
  grid-template-rows:repeat(7,14px);
  gap:4px;
  min-width:480px;
}
.hm-cell{
  border-radius:3px;
  background:#d2d2d6;
  border:0;
  padding:0;
  transition:transform .12s;
}
.hm-cell:hover{transform:scale(1.22)}
.hm-cell[data-l="1"]{background:#b0b0b6}
.hm-cell[data-l="2"]{background:#7f7f86}
.hm-cell[data-l="3"]{background:#4a4a4f}
.hm-cell[data-l="4"]{background:#161617}

/* Forms & Modals */
.form-grid{display:grid;gap:.9rem}
@media(min-width:640px){.form-grid.two-col{grid-template-columns:1fr 1fr}}
.field label{display:block;font-size:.83rem;font-weight:600;margin-bottom:.3rem}
.field input,.field select,.field textarea{
  width:100%;
  background:var(--pn);
  border:1px solid var(--ln);
  border-radius:var(--rad);
  padding:.6rem .8rem;
  outline:0;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--ink);
  box-shadow:0 0 0 3px #16161714;
}
.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:80;
  background:#16161799;
  display:none;
  place-items:center;
  padding:1rem;
}
.modal-backdrop.open{display:grid}
.modal-card{
  width:min(100%,560px);
  max-height:90vh;
  overflow-y:auto;
  background:var(--bg);
  border:1px solid var(--ln);
  border-radius:10px;
  padding:1.4rem;
}

/* Toast */
#toast{
  position:fixed;
  left:50%;
  bottom:1.4rem;
  transform:translate(-50%,16px);
  opacity:0;
  pointer-events:none;
  z-index:100;
  background:#161617;
  color:#ececee;
  border:1px solid #3d3d41;
  border-radius:10px;
  padding:.7rem 1rem;
  font-size:.86rem;
  display:flex;
  align-items:center;
  gap:.55rem;
  max-width:92vw;
  transition:opacity .2s,transform .25s cubic-bezier(.34,1.56,.64,1);
}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}


</style>
</head>
<body>



<main id="app" aria-live="polite"></main>



<div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <h3 id="modal-title" style="font-size:1.25rem">Modal</h3>
      <button type="button" class="icon-btn" id="modal-close" aria-label="Close"><i data-lucide="x"></i></button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast" role="status"><i data-lucide="check-circle-2"></i><span id="toast-msg"></span></div>

<script>
(() => {
  'use strict';

  const CATEGORIES = [

  function copyText(text, label) {
    let ok = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
        ok = true;
      }
    } catch (e) {}
    if (!ok) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e) {}
    }
    showToast(label || `Copied "${text}"`);
  }

  function sparklineSvg(arr) {
    const w = 88, h = 24, pad = 2;
    const min = Math.min(...arr), max = Math.max(...arr);
    const span = max - min || 1;
    const pts = arr.map((v, i) => {
      const x = pad + (i / Math.max(1, arr.length - 1)) * (w - pad * 2);
      const y = h - pad - ((v - min) / span) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="7-day download trend" role="img"><polyline fill="none" stroke="#161617" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/></svg>`;
  }

  function bumpPatch(ver) {
    const clean = ver.split('-')[0];
    const parts = clean.split('.').map((n) => parseInt(n, 10) || 0);
    while (parts.length < 3) parts.push(0);
    parts[2] += 1;
    return `${parts[0]}.${parts[1]}.${parts[2]}`;
  }

  function renderMarkdown(md) {
    const lines = md.split('\n');
    let html = '';
    let inCode = false;
    let codeBuf = [];
    let inList = false;

    const flushList = () => {
      if (inList) { html += '</ul>'; inList = false; }
    };
    const inlineFmt = (str) => esc(str).replace(/`([^`]+)`/g, '<code class="mono" style="background:#dcdce0;padding:.1rem .35rem;border-radius:4px;font-size:.86em">$1</code>');

    for (const line of lines) {
      if (line.startsWith('```')) {
        flushList();
        if (!inCode) {
          inCode = true;
          codeBuf = [];
        } else {
          inCode = false;
          const raw = codeBuf.join('\n');
          html += `<div class="code-block"><button type="button" class="icon-btn copy-code-btn" data-copy="${esc(raw)}" style="position:absolute;top:.5rem;right:.5rem;color:#a0a0a6" aria-label="Copy snippet"><i data-lucide="copy"></i></button><pre style="margin:0;white-space:pre">${esc(raw)}</pre></div>`;
        }
        continue;
      }
      if (inCode) { codeBuf.push(line); continue; }
      if (line.startsWith('## ')) { flushList(); html += `<h2>${inlineFmt(line.slice(3))}</h2>`; continue; }
      if (line.startsWith('### ')) { flushList(); html += `<h3>${inlineFmt(line.slice(4))}</h3>`; continue; }
      if (line.startsWith('- ')) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += `<li>${inlineFmt(line.slice(2))}</li>`;
        continue;
      }
      if (!line.trim()) { flushList(); continue; }
      flushList();
      html += `<p>${inlineFmt(line)}</p>`;
    }
    flushList();
    return html;
  }

  function getFilteredPackages() {
    const q = state.searchQuery.trim().toLowerCase();
    let list = state.packages.filter((p) => {
      const catOk = state.searchCategory === 'All' || p.category === state.searchCategory;
      if (!catOk) return false;
      if (!q) return true;
      return (
        p.name.toLowerCase().includes(q) ||
        p.description.toLowerCase().includes(q) ||
        p.category.toLowerCase().includes(q) ||
        p.maintainer.toLowerCase().includes(q) ||
        (p.scope && p.scope.toLowerCase().includes(q))
      );
    });
    if (state.searchSort === 'downloads') {
      list = [...list].sort((a, b) => b.weeklyDownloads - a.weeklyDownloads);
    } else if (state.searchSort === 'updated') {
      list = [...list].sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
    } else if (state.searchSort === 'name') {
      list = [...list].sort((a, b) => a.name.localeCompare(b.name));
    } else if (q) {
      list = [...list].sort((a, b) => {
        const aExact = a.name.toLowerCase().startsWith(q) ? 1 : 0;
        const bExact = b.name.toLowerCase().startsWith(q) ? 1 : 0;
        return bExact - aExact || b.weeklyDownloads - a.weeklyDownloads;
      });
    }
    return list;
  }

  function buildHeatmapHtml() {
    let seed = 17;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const cells = [];
    const end = Date.UTC(2026, 10, 25);
    for (let c = 0; c < 26; c++) {
      for (let r = 0; r < 7; r++) {
        const idx = c * 7 + r;
        const we = r >= 5;
        const q = rnd() < (we ? 0.52 : 0.14);
        const lv = q ? 0 : Math.min(4, Math.ceil(Math.pow(rnd(), we ? 1.7 : 1.05) * 4));
        const d = new Date(end - (26 * 7 - 1 - idx) * 864e5);
        const label = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
        const count = lv === 0 ? 0 : lv * 2 + (idx % 3);
        cells.push(`<button type="button" class="hm-cell" data-l="${lv}" title="${count} publishes on ${label}" aria-label="${count} publishes on ${label}"></button>`);
      }
    }
    return `
      <div class="pn hm-wrap">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;flex-wrap:wrap;gap:.5rem">
          <span style="font-weight:700;font-size:.94rem">26-Week Publish &amp; Release Activity</span>
          <span class="mut mono" style="font-size:.78rem">182 days · KEX Registry</span>
        </div>
        <div class="hm-grid">${cells.join('')}</div>
      </div>
    `;
  }

        <div class="counters" style="grid-template-columns:repeat(3,1fr);margin-top:1.75rem">
          <div class="counter-cell"><b class="mono">${owned.length}</b><span>Published Packages</span></div>
          <div class="counter-cell"><b class="mono">${fmtNum(totalOwnedDl)}</b><span>Total Weekly Downloads</span></div>
          <div class="counter-cell"><b class="mono">${state.starred.length}</b><span>Starred</span></div>
        </div>
      </div>

      <div class="wrap" style="display:grid;gap:1.5rem">
        ${buildHeatmapHtml()}
        <div>
          <div class="subtabs" role="tablist">
            <button type="button" class="subtab" data-proftab="packages" aria-selected="${state.profileTab === 'packages'}">Packages (${owned.length})</button>
            <button type="button" class="subtab" data-proftab="starred" aria-selected="${state.profileTab === 'starred'}">Starred (${starredPkgs.length})</button>
            <button type="button" class="subtab" data-proftab="orgs" aria-selected="${state.profileTab === 'orgs'}">Organizations (${state.orgs.length})</button>
          </div>
          ${tabHtml}
        </div>
      </div>
    `;
  }

  function renderDashboard() {
    const owned = state.packages.filter((p) => p.maintainer === state.user.handle);
    return `
      <div class="wrap" style="display:grid;gap:1.8rem;padding-top:clamp(18px,2.6vh,32px)">
        ${renderHeaderBar(false)}
        <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:1rem">
          <div>
            <span class="mono mut" style="font-size:.8rem">PUBLISHER WORKSPACE · ${esc(state.user.handle)}</span>
            <h1 style="font-size:clamp(1.7rem,2.8vw,2.4rem);margin-top:.2rem">Publisher Dashboard</h1>
          </div>
          <div style="display:flex;gap:.55rem;flex-wrap:wrap">
            <button type="button" class="btn btn-sm" id="dash-to-profile"><i data-lucide="user-round"></i>View Profile</button>
            <button type="button" class="btn btn-dark btn-sm" id="dash-publish-btn"><i data-lucide="plus"></i>Publish Package</button>
          </div>
        </div>

        <section>
          <h2 class="sec-title" style="margin-bottom:.8rem">Owned Packages (${owned.length})</h2>
          <div class="pn tbl-wrap">
            <table class="tbl">
              <thead><tr><th>Package</th><th>Version</th><th>Category</th><th>Weekly Downloads</th><th>Updated</th><th>Actions</th></tr></thead>
              <tbody>
                ${owned.map((p) => `
                  <tr>
                    <td><button type="button" class="pkg-name-link mono" style="font-size:.94rem" data-open-pkg="${esc(p.name)}">${esc(p.name)}</button></td>
                    <td class="mono">v${esc(p.version)}</td>
                    <td><span class="chip" style="font-size:.74rem">${esc(p.category)}</span></td>
                    <td class="mono">${p.weeklyDownloads.toLocaleString()}</td>
                    <td class="mono mut">${esc(p.updatedAt)}</td>
                    <td>
                      <button type="button" class="btn btn-sm bump-ver-btn" data-bump="${esc(p.name)}">
                        <i data-lucide="arrow-up-circle"></i>Bump patch
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </section>

        <section>
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem;margin-bottom:.8rem">
            <h2 class="sec-title">API Tokens (${state.tokens.length})</h2>
          </div>
          <div class="pn" style="padding:1rem;margin-bottom:.8rem">
            <form id="token-form" style="display:flex;flex-wrap:wrap;gap:.6rem;align-items:center">
              <input id="tok-name" placeholder="Token label (e.g. github-actions-ci)" style="flex:1;min-width:200px;background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:.5rem .75rem" required>
              <select id="tok-scope" class="select-box" style="padding:.48rem .75rem">
                <option value="publish:all">publish:all</option>
                <option value="publish:@kex/*">publish:@kex/*</option>
                <option value="read:only">read:only</option>
              </select>
              <button type="submit" class="btn btn-dark btn-sm"><i data-lucide="key-round"></i>Create Token</button>
            </form>
          </div>
          <div class="pn tbl-wrap">
            <table class="tbl">
              <thead><tr><th>Label</th><th>Token</th><th>Permissions</th><th>Created</th><th>Action</th></tr></thead>
              <tbody>
                ${state.tokens.map((t) => `
                  <tr>
                    <td style="font-weight:600">${esc(t.name)}</td>
                    <td class="mono mut">${esc(t.prefix)}••••••••</td>
                    <td><span class="chip mono" style="font-size:.74rem">${esc(t.scope)}</span></td>
                    <td class="mono mut">${esc(t.created)}</td>
                    <td><button type="button" class="btn btn-sm revoke-tok-btn" data-revoke="${esc(t.id)}">Revoke</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </section>

        <section>
          <h2 class="sec-title" style="margin-bottom:.8rem">Organizations &amp; Members</h2>
          <div class="scope-grid">
            ${state.orgs.map((o, idx) => `
              <div class="pn" style="padding:1.15rem;display:grid;gap:.75rem">
                <div style="display:flex;justify-content:space-between;align-items:center">
                  <div>
                    <span class="mono" style="font-weight:800;font-size:1.1rem">${esc(o.slug)}</span>
                    <div class="mut" style="font-size:.84rem">${esc(o.name)}</div>
                  </div>
                  <span class="chip mono">${esc(o.role)}</span>
                </div>
                <div style="display:grid;gap:.3rem;font-size:.84rem" class="mono">
                  ${o.members.map((m) => `<div style="padding:.25rem .45rem;background:var(--bg);border-radius:4px">${esc(m)}</div>`).join('')}
                </div>
                <form class="org-add-form" data-org-idx="${idx}" style="display:flex;gap:.4rem">
                  <input type="text" placeholder="@handle" style="flex:1;min-width:0;background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:.38rem .6rem;font-size:.84rem" required>
                  <button type="submit" class="btn btn-sm">Add</button>
                </form>
              </div>
            `).join('')}
          </div>
        </section>
      </div>
    `;
  }

  function render() {
    const app = $('#app');
    if (state.view === 'home') app.innerHTML = renderHome();
    else if (state.view === 'search') app.innerHTML = renderSearch();
    else if (state.view === 'pkg') app.innerHTML = renderPackageExplorer();
    else if (state.view === 'profile') app.innerHTML = renderProfile();
    else if (state.view === 'dashboard') app.innerHTML = renderDashboard();
    bindViewHandlers();
    icons();
  }

  function bindViewHandlers() {
    // Shared header & package handlers
    const navHome = $('#nav-home');
    if (navHome) navHome.onclick = () => navigate('#home');
    const navProf = $('#nav-profile');
    if (navProf) navProf.onclick = () => navigate('#profile');
    const navPub = $('#nav-publish');
    if (navPub) navPub.onclick = () => { navigate('#dashboard'); openPublishModal(); };
    document.querySelectorAll('[data-open-pkg]').forEach((el) => {
      el.addEventListener('click', () => navigate(`#pkg/${encodeURIComponent(el.dataset.openPkg)}`));
    });
    document.querySelectorAll('.copy-add-btn').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        copyText(`kex add ${el.dataset.add}`, `Copied "kex add ${el.dataset.add}"`);
      });
    });

    if (state.view === 'home') {
      const form = $('#home-search-form');
      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          state.searchQuery = $('#home-search-input').value;
          state.searchCategory = 'All';
          navigate('#search');
        };
      }
      const copyCmd = $('#hero-copy-cmd');
      if (copyCmd) copyCmd.onclick = () => copyText('kex install', 'Copied "kex install"');
      const viewAll = $('#home-view-all');
      if (viewAll) viewAll.onclick = () => { state.searchQuery = ''; state.searchCategory = 'All'; navigate('#search'); };
      document.querySelectorAll('[data-cat]').forEach((btn) => {
        btn.onclick = () => {
          state.searchCategory = btn.dataset.cat;
          state.searchQuery = '';
          navigate('#search');
        };
      });
      document.querySelectorAll('[data-scope]').forEach((btn) => {
        btn.onclick = () => {
          state.searchCategory = 'All';
          state.searchQuery = btn.dataset.scope;
          navigate('#search');
        };
      });
    }

    if (state.view === 'search') {
      const inp = $('#search-input');
      if (inp) {
        inp.oninput = (e) => {
          state.searchQuery = e.target.value;
          const pos = e.target.selectionStart;
          render();
          const newInp = $('#search-input');
          if (newInp) { newInp.focus(); newInp.setSelectionRange(pos, pos); }
        };
      }
      const sort = $('#search-sort');
      if (sort) sort.onchange = (e) => { state.searchSort = e.target.value; render(); };
      document.querySelectorAll('[data-filter-cat]').forEach((btn) => {
        btn.onclick = () => { state.searchCategory = btn.dataset.filterCat; render(); };
      });
      const clr = $('#clear-search');
      if (clr) clr.onclick = () => { state.searchQuery = ''; state.searchCategory = 'All'; render(); };
    }

    if (state.view === 'pkg') {
      const back = $('#back-to-search');
      if (back) back.onclick = () => navigate('#search');
      document.querySelectorAll('[data-pkgtab]').forEach((btn) => {
        btn.onclick = () => { state.pkgTab = btn.dataset.pkgtab; render(); };
      });
      document.querySelectorAll('[data-file]').forEach((btn) => {
        btn.onclick = () => { state.selectedFile = btn.dataset.file; render(); };
      });
      document.querySelectorAll('.copy-code-btn').forEach((btn) => {
        btn.onclick = () => copyText(btn.dataset.copy, 'Copied snippet');
      });
      const copyFileBtn = $('#copy-file-btn');
      if (copyFileBtn) {
        copyFileBtn.onclick = () => {
          const pkg = state.packages.find((p) => p.name === state.selectedPkg);
          if (pkg) copyText(pkg.files[state.selectedFile] || '', `Copied ${state.selectedFile}`);
        };
      }
      const starBtn = $('#toggle-star-btn');
      if (starBtn) {
        starBtn.onclick = () => {
          const pkg = state.packages.find((p) => p.name === state.selectedPkg);
          if (!pkg) return;
          const idx = state.starred.indexOf(pkg.name);
          if (idx >= 0) { state.starred.splice(idx, 1); pkg.stars = Math.max(0, pkg.stars - 1); showToast(`Removed star from ${pkg.name}`); }
          else { state.starred.push(pkg.name); pkg.stars += 1; showToast(`Starred ${pkg.name}`); }
          render();
        };
      }
      const verSel = $('#pkg-ver-select');
      if (verSel) {
        verSel.onchange = (e) => {
          state.selectedVersion = e.target.value;
          showToast(`Viewing ${state.selectedPkg}@${state.selectedVersion}`);
          render();
        };
      }
      const repoBtn = $('#copy-repo-btn');
      if (repoBtn) {
        repoBtn.onclick = () => {
          const pkg = state.packages.find((p) => p.name === state.selectedPkg);
          if (pkg) copyText(pkg.repo, `Copied repo URL: ${pkg.repo}`);
        };
      }
    }

    if (state.view === 'profile') {
      document.querySelectorAll('[data-proftab]').forEach((btn) => {
        btn.onclick = () => { state.profileTab = btn.dataset.proftab; render(); };
      });
      const editBtn = $('#edit-profile-btn');
      if (editBtn) editBtn.onclick = () => { state.editingProfile = true; render(); };
      const cancelBtn = $('#prof-cancel');
      if (cancelBtn) cancelBtn.onclick = () => { state.editingProfile = false; render(); };
      const editForm = $('#profile-edit-form');
      if (editForm) {
        editForm.onsubmit = (e) => {
          e.preventDefault();
          state.user.bio = $('#prof-bio').value.trim() || state.user.bio;
          state.user.location = $('#prof-loc').value.trim() || state.user.location;
          state.user.website = $('#prof-web').value.trim() || state.user.website;
          state.editingProfile = false;
          showToast('Profile updated');
          render();
        };
      }
      const openDash = $('#open-dashboard-btn');
      if (openDash) openDash.onclick = () => navigate('#dashboard');
    }

    if (state.view === 'dashboard') {
      const toProf = $('#dash-to-profile');
      if (toProf) toProf.onclick = () => navigate('#profile');
      const pubBtn = $('#dash-publish-btn');
      if (pubBtn) pubBtn.onclick = openPublishModal;

      document.querySelectorAll('.bump-ver-btn').forEach((btn) => {
        btn.onclick = () => {
          const pkg = state.packages.find((p) => p.name === btn.dataset.bump);
          if (!pkg) return;
          const nextVer = bumpPatch(pkg.version);
          pkg.version = nextVer;
          pkg.distTags.latest = nextVer;
          pkg.updatedAt = '2026-11-25';
          pkg.versions.unshift({ version: nextVer, tag: 'latest', date: '2026-11-25', notes: 'Patch release published via Publisher Dashboard.' });
          showToast(`Bumped ${pkg.name} to v${nextVer}`);
          render();
        };
      });

      const tokForm = $('#token-form');
      if (tokForm) {
        tokForm.onsubmit = (e) => {
          e.preventDefault();
          const name = $('#tok-name').value.trim();
          const scope = $('#tok-scope').value;
          if (!name) return;
          const randHex = Math.random().toString(16).slice(2, 6);
          const fullToken = `kex_live_${randHex}${Math.random().toString(16).slice(2, 12)}`;
          state.tokens.unshift({
            id: 'tok_' + Date.now(),
            name,
            prefix: `kex_live_${randHex}`,
            scope,
            created: '2026-11-25',
            lastUsed: 'just now'
          });
          copyText(fullToken, `Created token "${name}" (copied to clipboard)`);
          render();
        };
      }

      document.querySelectorAll('.revoke-tok-btn').forEach((btn) => {
        btn.onclick = () => {
          state.tokens = state.tokens.filter((t) => t.id !== btn.dataset.revoke);
          showToast('API token revoked');
          render();
        };
      });

      document.querySelectorAll('.org-add-form').forEach((form) => {
        form.onsubmit = (e) => {
          e.preventDefault();
          const idx = Number(form.dataset.orgIdx);
          const inp = form.querySelector('input');
          let handle = inp.value.trim();
          if (!handle) return;
          if (!handle.startsWith('@')) handle = '@' + handle;
          state.orgs[idx].members.push(`${handle} (Maintainer)`);
          showToast(`Added ${handle} to ${state.orgs[idx].slug}`);
          render();
        };
      });
    }
  }

  // Global Shortcuts
  $('#modal-close').onclick = closeModal;
  $('#modal-backdrop').onclick = (e) => { if (e.target === $('#modal-backdrop')) closeModal(); };
  $('#toast').onclick = () => $('#toast').classList.remove('on');

  window.addEventListener('keydown', (e) => {
    if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
      e.preventDefault();
      const target = $('#home-search-input') || $('#search-input');
      if (target) target.focus();
      else {
        navigate('#search');
        setTimeout(() => { const s = $('#search-input'); if (s) s.focus(); }, 30);
      }
    } else if (e.key === 'Escape') {
      closeModal();
    }
  });

  window.addEventListener('hashchange', applyRoute);
  applyRoute();
})();
</script>
</body>
</html>
